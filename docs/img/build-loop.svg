<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 150 1820 860" width="910" height="430" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Inside implement-change: the build loop</title>
  <desc id="desc">From an agreed ticket to a diff you review. Plan loop, up to 3 rounds: a planner drafts, a plan reviewer challenges, the plan is revised until the reviewer is clean. You approve the plan; changes go back to the plan loop. Review rounds, up to 5, fresh agents each round: build the agreed steps in order, reviewers run in parallel, fix what blocks, and the next round reruns only what still blocks. Simplify pass, up to 2 passes once clean: a simplicity reviewer, apply, recheck. You review the diff; changes go back to the build. Any finding that would change the plan or weaken a test stops for you.</desc>
  <defs><marker id="ah000000" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#000000"/></marker><marker id="ah1B51A5" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1B51A5"/></marker></defs>
  <rect x="50" y="150" width="1820" height="860" fill="#FFFFFF"/>
  <text x="72" y="200" font-size="28" fill="#565A5C">Inside one skill, implement-change: from an agreed ticket to a diff you review</text>
  <rect x="72" y="240" width="410" height="560" fill="#FFFFFF" stroke="#1B51A5" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="92" y="284" font-size="30" fill="#1B51A5" font-weight="700">Plan loop</text>
  <text x="92" y="316" font-size="24" fill="#565A5C">up to 3 rounds</text>
  <rect x="92" y="340" width="340" height="100" fill="#DCE5F3" stroke="#000000" stroke-width="3"/>
  <text x="106" y="378" font-size="26" fill="#1B51A5" font-weight="700">Planner drafts</text>
  <rect x="92" y="480" width="340" height="100" fill="#DCE5F3" stroke="#000000" stroke-width="3"/>
  <text x="106" y="518" font-size="26" fill="#1B51A5" font-weight="700">Plan reviewer</text>
  <rect x="92" y="620" width="340" height="100" fill="#DCE5F3" stroke="#000000" stroke-width="3"/>
  <text x="106" y="658" font-size="26" fill="#1B51A5" font-weight="700">Revise</text>
  <text x="106" y="690" font-size="22" fill="#000000">until the reviewer is clean</text>
  <path d="M262 440 L262.0 471.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <path d="M262 580 L262.0 611.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <path d="M432 670 L458 670 L458 530 L441.0 530.0" fill="none" stroke="#1B51A5" stroke-width="3" marker-end="url(#ah1B51A5)"/>
  <rect x="510" y="400" width="140" height="240" fill="#F3EBD3" stroke="#000000" stroke-width="3"/>
  <text x="580.0" y="486" font-size="28" fill="#1B51A5" font-weight="700" text-anchor="middle">You</text>
  <text x="580.0" y="520" font-size="28" fill="#1B51A5" font-weight="700" text-anchor="middle">approve</text>
  <text x="580.0" y="554" font-size="28" fill="#1B51A5" font-weight="700" text-anchor="middle">the plan</text>
  <rect x="678" y="240" width="580" height="560" fill="#FFFFFF" stroke="#1B51A5" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="698" y="284" font-size="30" fill="#1B51A5" font-weight="700">Review rounds</text>
  <text x="698" y="316" font-size="24" fill="#565A5C">up to 5, fresh agents each round</text>
  <rect x="698" y="340" width="500" height="100" fill="#DCE5F3" stroke="#000000" stroke-width="3"/>
  <text x="712" y="378" font-size="26" fill="#1B51A5" font-weight="700">Build</text>
  <text x="712" y="410" font-size="22" fill="#000000">the agreed steps, in order</text>
  <rect x="698" y="470" width="500" height="190" fill="#DCE5F3" stroke="#000000" stroke-width="3"/>
  <text x="712" y="508" font-size="26" fill="#1B51A5" font-weight="700">Reviewers, in parallel</text>
  <text x="712" y="540" font-size="22" fill="#000000">implementation: tests, linters, plan</text>
  <text x="712" y="570" font-size="22" fill="#000000">simplicity, documentation, tests</text>
  <text x="712" y="600" font-size="22" fill="#000000">only the focuses the diff gives work</text>
  <rect x="698" y="690" width="500" height="90" fill="#DCE5F3" stroke="#000000" stroke-width="3"/>
  <text x="712" y="728" font-size="26" fill="#1B51A5" font-weight="700">Fix what blocks</text>
  <text x="712" y="760" font-size="22" fill="#000000">next round reruns only what still blocks</text>
  <path d="M948 440 L948.0 461.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <path d="M948 660 L948.0 681.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <path d="M1198 735 L1230 735 L1230 565 L1207.0 565.0" fill="none" stroke="#1B51A5" stroke-width="3" marker-end="url(#ah1B51A5)"/>
  <rect x="1286" y="240" width="390" height="560" fill="#FFFFFF" stroke="#1B51A5" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="1306" y="284" font-size="30" fill="#1B51A5" font-weight="700">Simplify pass</text>
  <text x="1306" y="316" font-size="24" fill="#565A5C">up to 2 passes, once clean</text>
  <rect x="1306" y="340" width="320" height="100" fill="#DCE5F3" stroke="#000000" stroke-width="3"/>
  <text x="1320" y="378" font-size="26" fill="#1B51A5" font-weight="700">Simplicity reviewer</text>
  <rect x="1306" y="480" width="320" height="100" fill="#DCE5F3" stroke="#000000" stroke-width="3"/>
  <text x="1320" y="518" font-size="26" fill="#1B51A5" font-weight="700">Apply</text>
  <rect x="1306" y="620" width="320" height="100" fill="#DCE5F3" stroke="#000000" stroke-width="3"/>
  <text x="1320" y="658" font-size="26" fill="#1B51A5" font-weight="700">Recheck</text>
  <path d="M1466 440 L1466.0 471.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <path d="M1466 580 L1466.0 611.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <path d="M1626 670 L1652 670 L1652 390 L1635.0 390.0" fill="none" stroke="#1B51A5" stroke-width="3" marker-end="url(#ah1B51A5)"/>
  <rect x="1704" y="400" width="144" height="240" fill="#F3EBD3" stroke="#000000" stroke-width="3"/>
  <text x="1776.0" y="486" font-size="28" fill="#1B51A5" font-weight="700" text-anchor="middle">You</text>
  <text x="1776.0" y="520" font-size="28" fill="#1B51A5" font-weight="700" text-anchor="middle">review</text>
  <text x="1776.0" y="554" font-size="28" fill="#1B51A5" font-weight="700" text-anchor="middle">the diff</text>
  <path d="M482 520 L501.0 520.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <path d="M650 520 L669.0 520.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <path d="M1258 520 L1277.0 520.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <path d="M1676 520 L1695.0 520.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <path d="M580 640 L580 830 L277 830 L277.0 809.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <path d="M1776 640 L1776 860 L948 860 L948.0 809.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <text x="300" y="858" font-size="24" fill="#000000" font-style="italic">changes</text>
  <text x="1300" y="888" font-size="24" fill="#000000" font-style="italic">changes go back to the build</text>
  <text x="72" y="966" font-size="24" fill="#000000">Any finding that would change the plan or weaken a test stops for you.</text>
  <rect x="1000" y="940" width="44" height="36" fill="#F3EBD3" stroke="#000000" stroke-width="3"/>
  <text x="1056" y="968" font-size="24" fill="#000000">people think and decide</text>
  <rect x="1360" y="940" width="44" height="36" fill="#DCE5F3" stroke="#000000" stroke-width="3"/>
  <text x="1416" y="968" font-size="24" fill="#000000">agents do the work</text>
</svg>
