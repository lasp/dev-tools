<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 150 1820 920" width="910" height="460" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The ticket loop around the standard</title>
  <desc id="desc">A ring of six steps around the standard: 1 Design, ticket-draft, you settle the open questions; 2 Plan, implement-change, you approve the plan; 3 Build loop, implement-change, agents iterate until clean; 4 Self-review, pr-create and pr-review, you answer each finding and read the diff; 5 Human review, pr-fix, a colleague reviews and you agree, disagree or discuss; 6 Merge, no skill, a person merges; then back to 1. Monthly, across many tickets, the revision (revise) has the group decide what the standard changes. Every step reads the standard. Step 3 is agents' work; every other step is a person's decision.</desc>
  <defs><marker id="ah000000" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#000000"/></marker><marker id="ah1B51A5" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1B51A5"/></marker></defs>
  <rect x="50" y="150" width="1820" height="920" fill="#FFFFFF"/>
