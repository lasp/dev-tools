  <path d="M760 885 L650 885 L650.0 359.0" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#ah000000)"/>
  <path d="M430 600 L708.0 600.0" fill="none" stroke="#1B51A5" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#ah1B51A5)"/>
  <rect x="480" y="180" width="340" height="170" rx="22" fill="#F3EBD3" stroke="#000000" stroke-width="3"/>
  <text x="498" y="224" font-size="30" fill="#1B51A5" font-weight="700">1 Design</text>
  <text x="498" y="260" font-size="24" fill="#000000" font-family="Menlo, Consolas, monospace">ticket-draft</text>
  <text x="498" y="296" font-size="25" fill="#000000">You settle the open</text>
  <text x="498" y="327" font-size="25" fill="#000000">questions</text>
  <rect x="880" y="180" width="340" height="170" rx="22" fill="#F3EBD3" stroke="#000000" stroke-width="3"/>
  <text x="898" y="224" font-size="30" fill="#1B51A5" font-weight="700">2 Plan</text>
  <text x="898" y="260" font-size="24" fill="#000000" font-family="Menlo, Consolas, monospace">implement-change</text>
  <text x="898" y="296" font-size="25" fill="#000000">You approve the plan</text>
  <rect x="1280" y="180" width="340" height="170" rx="22" fill="#DCE5F3" stroke="#000000" stroke-width="3"/>
  <text x="1298" y="224" font-size="30" fill="#1B51A5" font-weight="700">3 Build loop</text>
  <text x="1298" y="260" font-size="24" fill="#000000" font-family="Menlo, Consolas, monospace">implement-change</text>
  <text x="1298" y="296" font-size="25" fill="#565A5C">Agents iterate until</text>
  <text x="1298" y="327" font-size="25" fill="#565A5C">clean</text>
  <rect x="1508" y="480" width="340" height="170" rx="22" fill="#F3EBD3" stroke="#000000" stroke-width="3"/>
  <text x="1526" y="524" font-size="30" fill="#1B51A5" font-weight="700">4 Self-review</text>
  <text x="1526" y="560" font-size="24" fill="#000000" font-family="Menlo, Consolas, monospace">pr-create, pr-review</text>
  <text x="1526" y="596" font-size="25" fill="#000000">You answer each finding</text>
  <text x="1526" y="627" font-size="25" fill="#000000">and read the diff</text>
  <rect x="1168" y="800" width="340" height="170" rx="22" fill="#F3EBD3" stroke="#000000" stroke-width="3"/>
  <text x="1186" y="844" font-size="30" fill="#1B51A5" font-weight="700">5 Human review</text>
  <text x="1186" y="880" font-size="24" fill="#000000" font-family="Menlo, Consolas, monospace">pr-fix</text>
  <text x="1186" y="916" font-size="25" fill="#000000">A colleague reviews; you</text>
  <text x="1186" y="947" font-size="25" fill="#000000">agree, disagree or discuss</text>
  <rect x="760" y="800" width="340" height="170" rx="22" fill="#F3EBD3" stroke="#000000" stroke-width="3"/>
  <text x="778" y="844" font-size="30" fill="#1B51A5" font-weight="700">6 Merge</text>
  <text x="778" y="880" font-size="24" fill="#000000" font-family="Menlo, Consolas, monospace">no skill</text>
  <text x="778" y="916" font-size="25" fill="#000000">A person merges</text>
  <rect x="90" y="480" width="340" height="170" rx="22" fill="#F3EBD3" stroke="#000000" stroke-width="3"/>
  <text x="108" y="524" font-size="30" fill="#1B51A5" font-weight="700">Monthly revision</text>
  <text x="108" y="560" font-size="24" fill="#000000" font-family="Menlo, Consolas, monospace">revise</text>
  <text x="108" y="596" font-size="25" fill="#000000">The group decides what</text>
  <text x="108" y="627" font-size="25" fill="#000000">the standard changes</text>
  <rect x="720" y="430" width="640" height="290" rx="28" fill="#FFFFFF" stroke="#1B51A5" stroke-width="5"/>
  <g transform="translate(752 466) scale(3)" fill="none" stroke="#1B51A5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></g>
  <text x="844" y="518" font-size="46" fill="#1B51A5" font-weight="700">The standard</text>
  <text x="752" y="590" font-size="28" fill="#000000">What the team has agreed:</text>
  <text x="752" y="626" font-size="28" fill="#000000">rules, decisions, terms.</text>
  <text x="752" y="676" font-size="24" fill="#565A5C">Every step reads it.</text>
  <rect x="1000" y="1020" width="44" height="36" fill="#F3EBD3" stroke="#000000" stroke-width="3"/>
  <text x="1060" y="1048" font-size="24" fill="#000000">a person decides</text>
  <rect x="1320" y="1020" width="44" height="36" fill="#DCE5F3" stroke="#000000" stroke-width="3"/>
  <text x="1380" y="1048" font-size="24" fill="#000000">agents do the work</text>
