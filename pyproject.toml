# Development environment only, managed with uv (`uv sync`). The plugin's scripts use the
# standard library alone and are not a package; these are the tools CI runs beside them.
[project]
name = "lasp-dev"
version = "0.0.0"
description = "Development environment for the lasp-dev Claude Code plugin"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pyyaml==6.0.3",    # tests/test_sandbox.py skips without it
    "codespell==2.4.1", # American spelling, as CI runs it
    "pre-commit==4.3.0", # runs .pre-commit-config.yaml's secret scan before a commit
]

[tool.uv]
package = false
