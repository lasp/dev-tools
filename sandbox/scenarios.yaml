    origin: "#2"
    why: >-
      A branch whose by_part adds the counts of a part listed twice, where main's by_part raises,
      a conflict of intent, so rebase stops and asks with both sides shown, leaving the rebase
      paused.
    turns:
      - /lasp-dev:rebase onto origin/main, without fetching; this checkout is offline.
    must_not_run: ["Bash(git push*)", "Bash(*git rebase --continue*)", "Bash(*git rebase --skip*)", "Bash(*git rebase --abort*)", "Bash(git stash*)", "Bash(*git reset*)", "mcp__*"]
    must_not_try: ["Bash(git push*)", "Bash(*=* git push*)", "Bash(git -c * push*)", "Bash(git -C * push*)"]
