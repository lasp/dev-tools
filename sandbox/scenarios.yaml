      conflict with one clear resolution, so rebase resolves it and completes without asking.
    turns:
      - /lasp-dev:rebase onto origin/main, without fetching; this checkout is offline.
    must_not_run: ["Bash(git push*)", "Bash(*git rebase --skip*)", "Bash(*git rebase --abort*)", "Bash(*git reset*)", "Bash(git stash*)", "mcp__*"]
    must_not_try: ["Bash(git push*)", "Bash(*=* git push*)", "Bash(git -c * push*)", "Bash(git -C * push*)"]
    verify:
      - test ! -d "$(git rev-parse --git-path rebase-merge)"
      - git merge-base --is-ancestor origin/main HEAD
      - test "$(git rev-list --count origin/main..HEAD)" = 1
      - grep -q "sum(widget.count for widget in widgets)" src/widgets/inventory.py
      - grep -q "listed twice" src/widgets/inventory.py
      - "! grep -q '^<<<<<<<' src/widgets/inventory.py"
    look_at: >-
      rebase replays the one commit onto origin/main, keeps both the renamed loop variable and
      main's by_part, and continues without a question. The report names the file, says what each
