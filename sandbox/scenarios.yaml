  - id: rebase-remote-ahead
    repo: widgets
    setup:
      - git config commit.gpgsign false
      - git switch -q -C widgets-shared main~1
      - "perl -pi -e 's/sum\\(w\\.count for w in widgets\\)/sum(widget.count for widget in widgets)/' src/widgets/inventory.py"
      - git commit -qam "Name the loop variable in total"
      - git push -q -f -u origin widgets-shared
      - 'c=$(git commit-tree "HEAD^{tree}" -p HEAD -m "A teammate pushed this") && git push -q -f origin "$c:refs/heads/widgets-shared" && git update-ref refs/remotes/origin/widgets-shared "$c"'
    origin: "#2"
    why: >-
      A branch whose remote copy holds a commit a teammate pushed after the last fetch, so rebase
      stops before rebasing and names that commit, which a rebase and a forced push would lose.
    turns:
      - /lasp-dev:rebase onto origin/main, without fetching; this checkout is offline.
    must_not_run: ["Bash(git push*)", "Bash(*git rebase*)", "Bash(*git reset*)", "Bash(git stash*)", "mcp__*"]
    must_not_try: ["Bash(git push*)", "Bash(*=* git push*)", "Bash(git -c * push*)", "Bash(git -C * push*)"]
