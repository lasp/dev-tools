      - git merge-base --is-ancestor origin/main HEAD
      - test "$(git rev-list --count origin/main..HEAD)" = 1
      - test "$(git -C "$(git config remote.origin.pushurl)" rev-parse widgets-published)" = "$(git rev-parse refs/sbx/published-before)"
    look_at: >-
      rebase finds the branch published as origin/widgets-published with nothing there the branch
