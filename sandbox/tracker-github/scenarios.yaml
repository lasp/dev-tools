# The GitHub tracker pack: scenarios in which `work` reads a GitHub issue as the ticket, served by
# fixture/github-mcp-server-stub.py from fixture/github.json, in `widgets` with its own standard
# recording a GitHub tracker whose labels map to the workflow and no ticket pattern. Build the
# sandbox as the generic pack's README says, then write its mcp.json naming the stub through
# $SBX_FIXTURES, which run.py sets for the session to this pack's fixture/:
#
#   {"mcpServers": {"github": {"command": "python3",
#     "args": ["-I", "${SBX_FIXTURES}/github-mcp-server-stub.py"]}}}
#
# The stub's file name holds github-mcp-server, so run.py gives the server the GitHub rules. It has
# no write tools. The issues: #9 closed as completed, #12 open with no label, #14 open and labeled
# `ready` and `enhancement`, #17 closed as not planned and still labeled `in progress`; #15 is a
# merged pull request, its body naming #9, and #16 one naming `o/r#90`. The fields are those of
# ../scenarios.yaml.

scenarios:
  - id: tracker-gh-work-unlabeled
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
    origin: "#59: work routes a GitHub issue by its state and labels"
    why: >-
      Works issue 12, open with no label, so work reads it from GitHub as an issue, not a pull
      request, and routes it as filed, to ticket-draft, and stops to ask.
    turns:
      - /lasp-dev:work 12
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "Edit", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      work reads #12 with issue_read and finds an open issue with no label; next_phase.py routes
      it: Next: ticket-draft, the first line naming #12, then asks whether to continue. No pull
      request is read.
    expect:
      ends: success
      mcp: [mcp__github__issue_read]
      says: ["(?m)^Next: ticket-draft\\."]
      not_says: ["(?m)^Next: (implement-change|pr-review|pr-fix)"]

  - id: tracker-gh-work-labeled
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
    origin: "#59: work routes a GitHub issue by its state and labels"
    why: >-
      Works issue 14, open and labeled ready, which the standard maps to implement-change, beside
      a label it does not map, so work routes it by the mapped label and stops to ask.
    turns:
      - /lasp-dev:work 14
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "Edit", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      work reads #14's state and labels, and next_phase.py routes it by `ready`: Next:
      implement-change, with 14 as its argument, then asks whether to continue. `enhancement` is
      passed over. No pull request is read, since ready is not among the pull request statuses.
    expect:
      ends: success
      mcp: [mcp__github__issue_read]
      says: ["(?m)^Next: implement-change\\."]
      not_says: ["(?m)^Next: (ticket-draft|pr-review|pr-fix)"]

  - id: tracker-gh-work-closed
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
    origin: "#59: work routes a GitHub issue by its state and labels"
    why: >-
      Works issue 9, closed as completed, so work says it is past the build and runs nothing.
    turns:
      - /lasp-dev:work 9
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "Edit", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      work reads #9, closed, and next_phase.py routes it to nothing: "#9 is closed", then
      "Nothing: the ticket is past the build; open it in the tracker to see why." No phase runs,
      and no pull request is read: a closed issue reads none.
    expect:
      ends: success
      mcp: [mcp__github__issue_read]
      agents_absent: [pr-reader]
      says: ["(?m)^Nothing: the ticket is past the build"]
      not_says: ["(?m)^Next: "]

  - id: tracker-gh-work-closed-labeled
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
    origin: "#59 (review of #115): a closed issue keeps its labels, and reads no pull request"
    why: >-
      Works issue 17, closed as not planned and still labeled `in progress`, one of the pull
      request statuses, so work must route it by its state, past the build, and read no pull
      request for the label.
    turns:
      - /lasp-dev:work 17
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "Edit", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      work reads #17, closed, and next_phase.py routes it to nothing: "#17 is closed", then
      "Nothing: the ticket is past the build". Its `in progress` label sends work to no pull
      request search and no pr-reader.
    expect:
      ends: success
      mcp: [mcp__github__issue_read]
      agents_absent: [pr-reader]
      says: ["(?m)^Nothing: the ticket is past the build"]
      not_says: ["(?m)^Next: "]

  - id: tracker-gh-work-branch
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - git checkout -q -B issue-14-low-stock
    origin: "#59: a branch named issue-<n>-words names issue n on a GitHub tracker"
    why: >-
      Works the branch issue-14-low-stock with no argument, in a standard that records no ticket
      pattern, so the branch names issue 14, which work reads and routes by its ready label.
    turns:
      - /lasp-dev:work
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "Edit", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      where.sh gives ticket=14 from the branch; work reads #14 and routes it: Next:
      implement-change, then asks whether to continue. It never asks which ticket.
    expect:
      ends: success
      mcp: [mcp__github__issue_read]
      says: ["(?m)^Next: implement-change\\."]
      not_says: ["(?m)^Next: (ticket-draft|pr-review|pr-fix)"]

  - id: tracker-gh-work-pr
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
    origin: "#59 (review of #113): a pull request's number on a GitHub tracker is not an issue"
    why: >-
      Works 15, the merged pull request for issue 9, so work's one issue_read finds a pull
      request's /pull/ link and reads it as that pull request, never as a ticket. The stub serves
      no pull_request_read, so the pull request read itself fails and work stops there.
    turns:
      - /lasp-dev:work 15
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "Edit", "Write(*/repos/widgets/[!.]*)", "Bash(*where.sh*--ticket 15*)"]
    look_at: >-
      work reads 15 with issue_read, sees /pull/ in its html_url, and takes it as pull request
      #15: it never gives where.sh --ticket 15, never routes 15 to ticket-draft or
      implement-change, and stops at the pull request read the stub cannot serve, saying so.
    expect:
      ends: success
      mcp: [mcp__github__issue_read]
      says: ["(?i)(pull request|PR) #?15"]
      not_says: ["(?m)^Next: (ticket-draft|implement-change)", "(?m)^#15 · "]

  # onboard on a repository with no standard, reading its GitHub issues. The stub also answers
  # onboard's search_repositories (public, on main) and search_code (nothing), so no standard
  # elsewhere covers widgets. Each setup makes its own history, since a run's reset keeps branches.
  - id: tracker-gh-onboard
    repo: widgets
    setup:
      - rm -f .git/github-writes.jsonl
      - git branch -D PROJ-42-csv-loader 2>/dev/null || true
      - git update-ref -d refs/remotes/origin/PROJ-42-csv-loader
      - git branch -f 9-by-part main && git branch -f issue-12-empty-inventory main
    origin: "#59: onboard detects GitHub Issues as the tracker and maps the labels the repository uses"
    why: >-
      Onboards widgets with no Jira key in its history and issues on GitHub, so onboard reads the
      issues, proposes GitHub Issues as the tracker with the labels mapped to the workflow, and
      writes the project settings as issue_tracker, never jira, and only under .review/onboard/.
    turns:
      - /lasp-dev:onboard
      - Here.
      - Take your recommended answers to those questions.
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "mcp__github__issue_write", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      The second turn lists the issues, finds no Jira project and proposes GitHub Issues: `ready`
      mapped to approved and `in progress` to implementation, both to implement-change, with `in
      progress` the pull request label; `enhancement` passed over as a kind of issue; no label
      proposed that no issue carries, such as needs-refinement; filed, finished and abandoned left
      to the issue's state; the issues this repository's, though one pull request names o/r#90;
      and the branches' pattern the default, not asked. The third turn writes
      .review/onboard/project.yaml with issue_tracker kind github and no location, then asks step
      5's question; nothing is written to standards/.
    expect:
      ends: success
      mcp: [mcp__github__list_issues]
      files: [".review/onboard/project.yaml"]
      files_absent: ["standards/*"]
    verify:
      - grep -Eq '^issue_tracker:' .review/onboard/project.yaml
      - grep -Eq '^[[:space:]]+kind:[[:space:]]*github' .review/onboard/project.yaml
      - grep -Eq "name:[[:space:]]*['\"]?ready" .review/onboard/project.yaml
      - "! grep -Eq '^jira:|^[[:space:]]+location:' .review/onboard/project.yaml"
      - "! grep -Eq \"name:[[:space:]]*['\\\"]?(enhancement|needs-refinement)\" .review/onboard/project.yaml"

  - id: tracker-gh-onboard-mixed
    repo: widgets
    setup:
      - rm -f .git/github-writes.jsonl
      - git branch -f PROJ-42-csv-loader main
    origin: "#59: onboard asks which tracker when the history names a Jira project and GitHub holds issues"
    why: >-
      Onboards widgets, whose branch PROJ-42-csv-loader names a Jira project while GitHub holds its
      issues, so the evidence is mixed and onboard asks which tracker holds the project's tickets
      before any question about the workflow, writing no project settings.
    turns:
      - /lasp-dev:onboard
      - Here.
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "mcp__github__issue_write", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      The second turn runs the survey, whose ticket project row names PROJ, lists the issues, and
      ends asking whether the project's tickets are in Jira or GitHub Issues, with the evidence for
      each, before mapping a label or a status. No project.yaml is written.
    expect:
      ends: success
      mcp: [mcp__github__list_issues]
      says: ["(?i)jira", "(?i)github issues"]
      files_absent: ["standards/*", ".review/onboard/project.yaml"]
