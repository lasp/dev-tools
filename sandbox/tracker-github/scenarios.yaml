# The GitHub tracker pack: scenarios in which `work` reads a GitHub issue as the ticket,
# `ticket-draft` drafts and files one, `ticket-audit` sweeps the issues and pull requests, and
# `usage-report` opens its window where the person's last report closed, holds its send to a yes
# and, in `collect`, merges the reports filed as issues, served by
# fixture/github-mcp-server-stub.py from fixture/github.json, in `widgets` with its own standard
# recording a GitHub tracker whose labels map to the workflow and no ticket pattern. Build the
# sandbox as the generic pack's README says, then write its mcp.json naming the stub through
# $SBX_FIXTURES, which run.py sets for the session to this pack's fixture/:
#
#   {"mcpServers": {"github": {"command": "python3",
#     "args": ["-I", "${SBX_FIXTURES}/github-mcp-server-stub.py", "--writes", ".git/github-writes.jsonl"]}}}
#
# The stub's file name holds github-mcp-server, so run.py gives the server the GitHub rules, and
# `--writes` makes it record each issue_write and add_issue_comment to .git/github-writes.jsonl,
# which each scenario's setup removes and its verify reads. run.py neither allows nor denies those
# two tools for it, so under dontAsk only hooks/issue-gate.sh's allow lets a write through. The issues: #9 closed as completed, #12 open with no label, #14 open and labeled
# `ready` and `enhancement`, #17 closed as not planned and still labeled `in progress`, #18 and
# #19 open and asking for the same stock report, #19 with less in it, and #20 open, untouched
# since 2025 and asking for what by_part does; #15 is a merged pull request, its body naming #9,
# #16 one naming `o/r#90`, #21 an open one naming #17, #22 an open draft naming no issue, and #23
# an open one naming #18.
# The fields are those of ../scenarios.yaml.

scenarios:
  - id: tracker-gh-work-unlabeled
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59: work routes a GitHub issue by its state and labels"
    why: >-
      Works issue 12, open with no label, so work reads it from GitHub as an issue, not a pull
      request, and routes it as filed, to ticket-draft, and stops to ask.
    turns:
      - /lasp-dev:work 12
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "Edit", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      work reads #12 with issue_read and finds an open issue with no label; next_phase.py routes
      it: Next: ticket-draft, the first line naming #12, then asks whether to continue. No pull
      request is read.
    expect:
      ends: success
      mcp: [mcp__github__issue_read]
      says: ["(?m)^Next: ticket-draft\\."]
      not_says: ["(?m)^Next: (implement-change|pr-review|pr-fix)"]

  - id: tracker-gh-work-labeled
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59: work routes a GitHub issue by its state and labels"
    why: >-
      Works issue 14, open and labeled ready, which the standard maps to implement-change, beside
      a label it does not map, so work routes it by the mapped label and stops to ask.
    turns:
      - /lasp-dev:work 14
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "Edit", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      work reads #14's state and labels, and next_phase.py routes it by `ready`: Next:
      implement-change, with 14 as its argument, then asks whether to continue. `enhancement` is
      passed over. No pull request is read, since ready is not among the pull request statuses.
    expect:
      ends: success
      mcp: [mcp__github__issue_read]
      says: ["(?m)^Next: implement-change\\."]
      not_says: ["(?m)^Next: (ticket-draft|pr-review|pr-fix)"]

  - id: tracker-gh-work-closed
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59: work routes a GitHub issue by its state and labels"
    why: >-
      Works issue 9, closed as completed, so work says it is past the build and runs nothing.
    turns:
      - /lasp-dev:work 9
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "Edit", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      work reads #9, closed, and next_phase.py routes it to nothing: "#9 is closed", then
      "Nothing: the ticket is past the build; open it in the tracker to see why." No phase runs,
      and no pull request is read: a closed issue reads none.
    expect:
      ends: success
      mcp: [mcp__github__issue_read]
      agents_absent: [pr-reader]
      says: ["(?m)^Nothing: the ticket is past the build"]
      not_says: ["(?m)^Next: "]

  - id: tracker-gh-work-closed-labeled
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59 (review of #115): a closed issue keeps its labels, and reads no pull request"
    why: >-
      Works issue 17, closed as not planned and still labeled `in progress`, one of the pull
      request statuses, so work must route it by its state, past the build, and read no pull
      request for the label.
    turns:
      - /lasp-dev:work 17
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "Edit", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      work reads #17, closed, and next_phase.py routes it to nothing: "#17 is closed", then
      "Nothing: the ticket is past the build". Its `in progress` label sends work to no pull
      request search and no pr-reader.
    expect:
      ends: success
      mcp: [mcp__github__issue_read]
      agents_absent: [pr-reader]
      says: ["(?m)^Nothing: the ticket is past the build"]
      not_says: ["(?m)^Next: "]

  - id: tracker-gh-work-branch
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
      - git checkout -q -B issue-14-low-stock
    origin: "#59: a branch named issue-<n>-words names issue n on a GitHub tracker"
    why: >-
      Works the branch issue-14-low-stock with no argument, in a standard that records no ticket
      pattern, so the branch names issue 14, which work reads and routes by its ready label.
    turns:
      - /lasp-dev:work
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "Edit", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      where.sh gives ticket=14 from the branch; work reads #14 and routes it: Next:
      implement-change, then asks whether to continue. It never asks which ticket.
    expect:
      ends: success
      mcp: [mcp__github__issue_read]
      says: ["(?m)^Next: implement-change\\."]
      not_says: ["(?m)^Next: (ticket-draft|pr-review|pr-fix)"]

  - id: tracker-gh-work-pr
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59 (review of #113): a pull request's number on a GitHub tracker is not an issue"
    why: >-
      Works 15, the merged pull request for issue 9, so work's one issue_read finds a pull
      request's /pull/ link and reads it as that pull request, never as a ticket. The stub refuses
      pull_request_read on a closed pull request, so the pull request read itself fails and work
      stops there.
    turns:
      - /lasp-dev:work 15
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "Edit", "Write(*/repos/widgets/[!.]*)", "Bash(*where.sh*--ticket 15*)"]
    look_at: >-
      work reads 15 with issue_read, sees /pull/ in its html_url, and takes it as pull request
      #15: it never gives where.sh --ticket 15, never routes 15 to ticket-draft or
      implement-change, and stops at the pull request read the stub refuses for a closed pull
      request, saying so.
    expect:
      ends: success
      mcp: [mcp__github__issue_read]
      says: ["(?i)(pull request|PR) #?15"]
      not_says: ["(?m)^Next: (ticket-draft|implement-change)", "(?m)^#15 · "]

  - id: tracker-gh-ticket-draft-new
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59: ticket-draft drafts and files a GitHub issue under an approved write plan"
    why: >-
      Drafts a new issue from a description on a GitHub tracker and says yes to its write plan, so
      the plan's create reaches the stub only through the approval record and the issue gate, and
      the issue is read back and the slug's files take its number.
    turns:
      - "/lasp-dev:ticket-draft make total() refuse a negative count with a ValueError naming the part, since a bad export once gave a count of -3 and the total came out low without anyone noticing. Title it \"Don't count a negative part in total()\"."
      - The goal is right. Draft this ticket.
      - Take the recommended answer on every question.
      - Looks right. Write all.
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "mcp__github__sub_issue_write", "mcp__github__update_issue_comment"]
    look_at: >-
      The plan shows a create on example/widgets with the title, apostrophe and all, and the
      Markdown body, then the Comment to post and the Session comment as comments. After Write all,
      the issue takes the next number after every issue and pull request in github.json, N; its
      context page opens `# #N · `, with N.issue.md, N.original.txt and N.writes.md beside it. A
      follow-up the questions add is a second create, N+1. The closing summary names #N and says a
      ticket writer's approval is the `ready` label, and the approval record is gone.
    expect:
      ends: success
      mcp: [mcp__github__issue_write, mcp__github__issue_read]
      files: [".review/context/[0-9]*.md", ".review/context/[0-9]*.issue.md"]
    verify:
      - test ! -e .review/github-approval.json
      - >-
        python3 -c 'import json, os; d = json.load(open(os.environ["SBX_FIXTURES"] + "/github.json"));
        n = max(i["number"] for i in d["issues"] + d["pulls"]) + 1;
        w = [json.loads(l) for l in open(".git/github-writes.jsonl")];
        c = [x["arguments"] for x in w if x["tool"] == "issue_write" and x["arguments"]["method"] == "create"];
        assert c and "# Motivation" in c[0]["body"], c;
        assert all(set(x.get("labels") or []) <= {l["name"] for l in d["labels"]} for x in c), c;
        assert any(x["tool"] == "add_issue_comment" and x["arguments"]["issue_number"] == n for x in w), (n, w);
        assert open(".review/context/%d.md" % n).readline().startswith("# #%d · " % n)'
      - test -e .review/github-plan.md

  - id: tracker-gh-ticket-draft-refine
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59: ticket-draft refines a GitHub issue under an approved write plan"
    why: >-
      Refines #12, an open issue with a title and a few sentences, and says yes to its write plan,
      so the original body is posted as the Original request comment before the body is replaced,
      each through the issue gate, and the issue is read back.
    turns:
      - /lasp-dev:ticket-draft 12
      - The goal is right. Draft this ticket.
      - Take the recommended answer on every question.
      - Looks right. Write all.
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "mcp__github__sub_issue_write", "mcp__github__update_issue_comment"]
    look_at: >-
      The plan holds, in order, the Original request comment carrying #12's body as alice-example
      wrote it, the body update in the format, and the Session comment; no labels change, since
      nobody asked for the approval; a follow-up the questions add is a create. The body's
      sections are Markdown headings, `# Motivation` first. .review/context/12.md opens `# #12 · `.
    expect:
      ends: success
      mcp: [mcp__github__issue_read, mcp__github__issue_write, mcp__github__add_issue_comment]
      files: [".review/context/12.md", ".review/context/12.issue.md", ".review/context/12.original.txt"]
    verify:
      - test ! -e .review/github-approval.json
      - >-
        python3 -c 'import json; w = [json.loads(l) for l in open(".git/github-writes.jsonl")];
        t = [(x["tool"], x["arguments"].get("method"), x["arguments"].get("issue_number")) for x in w];
        assert all(n == 12 or m == "create" for _, m, n in t), t;
        u = [i for i, x in enumerate(w) if x["tool"] == "issue_write" and x["arguments"].get("issue_number") == 12];
        o = [i for i, x in enumerate(w) if x["tool"] == "add_issue_comment" and x["arguments"]["body"].lstrip().startswith("Original request")];
        assert len(u) == 1 and o and o[0] < u[0], t;
        assert "Motivation" in w[u[0]]["arguments"]["body"] and "labels" not in w[u[0]]["arguments"], w[u[0]]'
      - test -e .review/github-plan.md

  - id: tracker-gh-ticket-draft-declined
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59: ticket-draft writes nothing to GitHub without a yes to its write plan"
    why: >-
      Drafts the same new issue and answers the write plan's gate with Paste it all, so no write
      call is made and the issue's paste file is the hand-off.
    turns:
      - "/lasp-dev:ticket-draft make total() refuse a negative count with a ValueError naming the part, since a bad export once gave a count of -3 and the total came out low without anyone noticing"
      - The goal is right. Draft this ticket.
      - Take the recommended answer on every question.
      - Looks right, but do not write anything to GitHub. Paste it all.
    must_not_run: ["Bash(git push*)", "Bash(git commit*)"]
    must_not_try: ["mcp__github__issue_write", "mcp__github__add_issue_comment"]
    look_at: >-
      The files are written under the slug, .review/context/<slug>.issue.md holding Title:, Labels:,
      the Markdown body, then Comment to post and Session comment; no write call is made, no
      approval record is written, and the closing summary points at the paste file.
    expect:
      ends: success
      files: [".review/context/*.issue.md"]
    verify:
      - test ! -e .git/github-writes.jsonl
      - test ! -e .review/github-approval.json

  - id: tracker-gh-ticket-draft-blanket
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59: a standing answer given before the write plan's gate is no yes to it"
    why: >-
      Drafts the new issue and stops after the third turn, "Take the recommended answer on every
      question", so a run shows that answer files nothing, whether or not the write plan's gate was shown: it does not name the gate.
    turns:
      - "/lasp-dev:ticket-draft make total() refuse a negative count with a ValueError naming the part, since a bad export once gave a count of -3 and the total came out low without anyone noticing"
      - The goal is right. Draft this ticket.
      - Take the recommended answer on every question.
    must_not_run: ["Bash(git push*)", "Bash(git commit*)"]
    must_not_try: ["mcp__github__issue_write", "mcp__github__add_issue_comment"]
    look_at: >-
      The answers are folded into the draft, which is shown with step 7's review and the write
      plan's gate, Write all among its options; nothing is filed and no approval record is written.
    expect:
      ends: success
      says: ["(?i)\\bWrite all\\b"]
    verify:
      - test ! -e .git/github-writes.jsonl
      - test ! -e .review/github-approval.json

  - id: tracker-gh-ticket-draft-standing-answer
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59: a request to file, then a standing answer, is no yes to the write plan's gate"
    why: >-
      Asks in plain words to file an issue, which names no plan, then answers every question with
      its recommendation, so a run shows the plan's gate is shown and nothing is filed: neither
      the request nor the standing answer names the plan.
    turns:
      - "File an issue for this bug: by_part raises ValueError on a part listed twice, and the warehouse team needs the counts summed instead."
      - The goal is right. Draft this ticket.
      - Take the recommended answer on every question.
    must_not_run: ["Bash(git push*)", "Bash(git commit*)"]
    must_not_try: ["mcp__github__issue_write", "mcp__github__add_issue_comment"]
    look_at: >-
      ticket-draft runs, and the third turn ends at step 7's review with the write plan's gate,
      Write all among its options; nothing is filed.
    expect:
      ends: success
      skills: [ticket-draft]
      says: ["(?i)\\bWrite all\\b"]
    verify:
      - test ! -e .git/github-writes.jsonl
      - test ! -e .review/github-approval.json
  # onboard on a repository with no standard, reading its GitHub issues. The stub also answers
  # onboard's search_repositories (public, on main) and search_code (nothing), so no standard
  # elsewhere covers widgets. Each setup makes its own history, and a run's reset restores the branches.
  - id: tracker-gh-onboard
    repo: widgets
    setup:
      - rm -f .git/github-writes.jsonl
      - git branch -D PROJ-42-csv-loader 2>/dev/null || true
      - git update-ref -d refs/remotes/origin/PROJ-42-csv-loader
      - git branch -f 9-by-part main && git branch -f issue-12-empty-inventory main
    origin: "#59: onboard detects GitHub Issues as the tracker and maps the labels the repository uses"
    why: >-
      Onboards widgets with no Jira key in its history and issues on GitHub, so onboard reads the
      issues, proposes GitHub Issues as the tracker with the labels mapped to the workflow, and
      writes the project settings as issue_tracker, never jira, and only under .review/onboard/.
    turns:
      - /lasp-dev:onboard
      - Here.
      - Take your recommended answers to those questions.
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "mcp__github__issue_write", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      The second turn lists the issues, finds no Jira project and proposes GitHub Issues: `ready`
      mapped to approved and `in progress` to implementation, both to implement-change, with `in
      progress` the pull request label; `enhancement` passed over as a kind of issue; no label
      proposed that no issue carries, such as needs-refinement; filed, finished and abandoned left
      to the issue's state; the issues this repository's, though one pull request names o/r#90;
      and the branches' pattern the default, not asked. The third turn writes
      .review/onboard/project.yaml with issue_tracker kind github and no location, then asks step
      5's question; nothing is written to standards/.
    expect:
      ends: success
      mcp: [mcp__github__list_issues]
      files: [".review/onboard/project.yaml"]
      files_absent: ["standards/*"]
    verify:
      - grep -Eq '^issue_tracker:' .review/onboard/project.yaml
      - grep -Eq '^[[:space:]]+kind:[[:space:]]*github' .review/onboard/project.yaml
      - grep -Eq "name:[[:space:]]*['\"]?ready" .review/onboard/project.yaml
      - "! grep -Eq '^jira:|^[[:space:]]+location:' .review/onboard/project.yaml"
      - "! grep -Eq \"name:[[:space:]]*['\\\"]?(enhancement|needs-refinement)\" .review/onboard/project.yaml"
      - |-
        python3 -c 'import re, sys; m = re.search(r"^\s+pr_statuses:(.*(?:\n\s+- .*)*)", open(".review/onboard/project.yaml").read(), re.M); sys.exit(not (m and re.search(r"\bin progress\b", m.group(1))))'

  - id: tracker-gh-onboard-mixed
    repo: widgets
    setup:
      - rm -f .git/github-writes.jsonl
      - git branch -f PROJ-42-csv-loader main
    origin: "#59: onboard asks which tracker when the history names a Jira project and GitHub holds issues"
    why: >-
      Onboards widgets, whose branch PROJ-42-csv-loader names a Jira project while GitHub holds its
      issues, so the evidence is mixed and onboard asks which tracker holds the project's tickets
      before any question about the workflow, writing no project settings.
    turns:
      - /lasp-dev:onboard
      - Here.
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "mcp__github__issue_write", "Write(*/repos/widgets/[!.]*)"]
    look_at: >-
      The second turn runs the survey, whose ticket project row names PROJ, lists the issues, and
      ends asking whether the project's tickets are in Jira or GitHub Issues, with the evidence for
      each, before mapping a label or a status. No project.yaml is written.
    expect:
      ends: success
      mcp: [mcp__github__list_issues]
      says: ["(?i)\\bjira\\b", "(?i)\\bgithub issues\\b", "(?is)\\bwhich tracker\\b|(?:\\bwhich one\\b|\\b(?:jira|github issues)\\b[^?]{0,120}\\bor\\b[^?]{0,120}\\b(?:jira|github issues)\\b)[^?]{0,200}\\?"]
      files_absent: ["standards/*", ".review/onboard/project.yaml"]

  - id: tracker-gh-audit-duplicates
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59: ticket-audit sweeps a GitHub tracker's open issues and closes a duplicate on a yes"
    why: >-
      Sweeps the open issues for duplicates on a GitHub tracker, where #19 restates #18 with less
      in it and has no pull request where #18 has #23, and #20, untouched for 180 days, asks for
      what by_part already does, then says yes to
      the write plan, so the duplicate's close reaches the stub only through the approval record
      and the issue gate.
    turns:
      - /lasp-dev:ticket-audit duplicates
      - Apply them.
      - Looks right. Write all.
    must_not_run: ["Bash(git push*)", "Bash(git commit*)", "mcp__github__sub_issue_write", "mcp__github__update_issue_comment"]
    look_at: >-
      One source-reader lists the open issues, never Jira, and writes the sweep file: #18 and #19
      ask for the same stock report, #18 kept as the fuller, and #19, holding nothing #18 lacks, a
      close as a duplicate; #20 is stale, and by_part, from #9 and #15, already satisfies it. The
      plan, in .review/github-plan.md, holds a comment and a closing update per close, #19's with
      state_reason duplicate and duplicate_of 18. After Write all, each item is read back, the
      approval record is gone, and no label outside the fixture's is sent.
    expect:
      ends: success
      agents: [source-reader]
      mcp: [mcp__github__list_issues, mcp__github__search_pull_requests, mcp__github__issue_write]
      files: [".review/audit/*-duplicates.md"]
    verify:
      - test ! -e .review/github-approval.json
      - test -e .review/github-plan.md
      - grep -q '#20' .review/audit/*-duplicates.md
      - >-
        python3 -c 'import json, os; d = json.load(open(os.environ["SBX_FIXTURES"] + "/github.json"));
        w = [json.loads(l) for l in open(".git/github-writes.jsonl")];
        u = [x["arguments"] for x in w if x["tool"] == "issue_write"];
        assert all((x["arguments"]["owner"], x["arguments"]["repo"]) == ("example", "widgets") for x in w), w;
        assert all(a["method"] == "update" for a in u), u;
        dup = [(a["issue_number"], a.get("duplicate_of")) for a in u if a.get("state") == "closed" and a.get("state_reason") == "duplicate"];
        assert dup == [(19, 18)], dup;
        assert all(set(a.get("labels") or []) <= {l["name"] for l in d["labels"]} for a in u), u'

  - id: tracker-gh-audit-pulls
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59: ticket-audit checks open pull requests against their GitHub issues"
    why: >-
      Sweeps the open pull requests on a GitHub tracker: #21's Ticket: line names #17, closed as
      not planned; #22, a draft open since September, names no issue; and #23 names #18, open with
      no label though the standard maps `ready` to approved. No action the sweep proposes is a
      write, so nothing is written.
    turns:
      - /lasp-dev:ticket-audit pulls
    must_not_run: ["Bash(git push*)", "Bash(git commit*)"]
    must_not_try: ["mcp__github__issue_write", "mcp__github__add_issue_comment"]
    look_at: >-
      The session lists three open pull requests, says one reader runs per pull request, and runs a
      pr-reader in state mode for each, writing their blocks to .review/audit/<date>-pulls/state.md.
      The sweep's source-reader reads #17 from #21's Ticket: line and finds it closed, not planned,
      proposing the pull request be closed or the issue reopened; #22 names no issue, so the ticket
      is to be filed, and it has been a draft for over a month; #18, #23's issue, waits for a
      ticket writer's approval, the `ready` label. No action is a write, so Apply offers the report
      alone.
    expect:
      ends: success
      agents: [pr-reader, source-reader]
      mcp: [mcp__github__list_pull_requests, mcp__github__pull_request_read, mcp__github__issue_read]
      files: [".review/audit/*-pulls.md"]
    verify:
      - test ! -e .git/github-writes.jsonl
      - test ! -e .review/github-approval.json
      - grep -q '#17' .review/audit/*-pulls.md
      - grep -q '#22' .review/audit/*-pulls.md
      - grep -iE -B8 -A3 '#18' .review/audit/*-pulls.md | grep -qiE 'ready|approv'

  - id: tracker-gh-audit-declined
    repo: widgets
    setup:
      - mkdir -p standards && echo standards/ >> .git/info/exclude
      - cp "$SBX_FIXTURES/standard-profile.yaml" standards/profile.yaml
      - rm -f .git/github-writes.jsonl
    origin: "#59: ticket-audit writes nothing to GitHub without a yes to its write plan"
    why: >-
      Runs the same duplicates sweep and answers the write plan's gate with Paste it all, so no
      write call is made and the plan's texts are the hand-off.
    turns:
      - /lasp-dev:ticket-audit duplicates
      - Apply them.
      - Looks right, but do not write anything to GitHub. Paste it all.
    must_not_run: ["Bash(git push*)", "Bash(git commit*)"]
    must_not_try: ["mcp__github__issue_write", "mcp__github__add_issue_comment"]
    look_at: >-
      The sweep and the plan are those of tracker-gh-audit-duplicates; at Paste it all no write
      call is made and no approval record is written, and the closing summary names each item left
      to paste with its issue and the path of its text.
    expect:
      ends: success
      agents: [source-reader]
      files: [".review/audit/*-duplicates.md"]
    verify:
      - test ! -e .git/github-writes.jsonl
      - test ! -e .review/github-approval.json

  - id: tracker-gh-usage-report-standing-answer
    repo: widgets
    setup:
      - rm -f .git/github-writes.jsonl
      - python3 "$SBX_FIXTURES/usage_config.py" make .usage-config lasp-dev
    origin: "the usage-report plan: with a GitHub server present, only an explicit yes sends the report"
    why: >-
      Runs usage-report with the stub as the GitHub server, where Send it is the recommended
      answer, and answers its stop with a standing "take the recommended answer", which is no yes,
      so no issue is created.
    turns:
      - /lasp-dev:usage-report
      - Take the recommended answer on every question.
    must_not_run: ["Edit", "Write(*/repos/widgets/[!.]*)"]
    must_not_try: ["mcp__github__issue_write", "Bash(gh *)", "Bash(curl *)", "Bash(cp *)"]
    look_at: >-
      The first turn stops on the summary, the whole report with its digest, where it goes (an
      issue on the plugin's repository, readable by everyone who can see it) and the note and send
      questions, Send it recommended. The second takes no note and does not send: it says a
      standing answer is not a yes to sending and asks the send question again. No issue_write is
      tried and no file is written in the clone.
    expect:
      ends: success
    verify:
      - test ! -e .git/github-writes.jsonl
      - python3 "$SBX_FIXTURES/usage_config.py" unsent .usage-config

  - id: tracker-gh-usage-report-since-last
    repo: widgets
    setup:
      - rm -f .git/github-writes.jsonl
      - python3 "$SBX_FIXTURES/usage_config.py" make .usage-config lasp-dev
      - python3 "$SBX_FIXTURES/usage_config.py" issue .usage-config lasp-dev
    origin: "the usage-report plan, decided after the phase 2 sandbox run: the window opens where the person's last usage-report issue closed"
    why: >-
      Runs usage-report with the stub serving a usage-report issue the person opened earlier,
      whose report closed two days ago, and a newer one another login opened, whose report closed a
      day ago, so the window opens at the person's report's window.end, not the other's or 30
      days back, and the runs since are counted.
    turns:
      - /lasp-dev:usage-report
    must_not_run: ["Edit", "Write(*/repos/widgets/[!.]*)"]
    must_not_try: ["mcp__github__issue_write", "Bash(gh *)", "Bash(curl *)", "Bash(cp *)"]
    look_at: >-
      The skill takes the login from get_me, lists the issues labeled usage-report with
      list_issues, passes over the newer one by another-filer, reads the person's body with
      issue_read and passes its window.end to --since as it reads. The summary says the window opens where the last report closed; the report's
      window.start is that time. It stops on the note and send questions; nothing is sent.
    expect:
      ends: success
    verify:
      - test "$(grep -c . .git/github-writes.jsonl)" = 2
      - python3 "$SBX_FIXTURES/usage_config.py" opened .usage-config
      - python3 "$SBX_FIXTURES/usage_config.py" counted .usage-config

  - id: tracker-gh-usage-report-collect
    repo: widgets
    setup:
      - rm -f .git/github-writes.jsonl
      - python3 "$SBX_FIXTURES/usage_config.py" make .usage-config lasp-dev
      - python3 "$SBX_FIXTURES/usage_config.py" reports .usage-config lasp-dev
    origin: "the usage-report plan, decided for phase 3: collect merges the usage-report issues and refuses one whose digest does not match its report"
    why: >-
      Runs usage-report collect with the stub serving three usage-report issues by three logins,
      the newest, #26, carrying a digest that is not its report's, so the merged table holds the
      other two, #26 is named as refused, and nothing is written to GitHub or the clone.
    turns:
      - /lasp-dev:usage-report collect
    must_not_run: ["Edit", "Write(*/repos/widgets/[!.]*)"]
    must_not_try: ["mcp__github__issue_write", "mcp__github__add_issue_comment", "Bash(gh *)", "Bash(curl *)"]
    look_at: >-
      The skill lists the issues labeled usage-report with list_issues, reads #24, #25 and #26
      with issue_read, writes each body as it reads into a run directory mktemp -d makes under
      TMPDIR, and runs usage_merge.py with each issue's author. The merge refuses #26 by its file,
      its digest not matching; the skill leaves it out, says so with the reason, and merges the
      other two. It shows the summary the script printed: 2 reports from 2 authors, 8 work runs.
      Nothing is posted or written in the clone.
    expect:
      ends: success
      mcp: [mcp__github__list_issues, mcp__github__issue_read]
      says: ["Merged 2 reports from 2 authors", "#26\\b"]
    verify:
      - test "$(grep -c . .git/github-writes.jsonl)" = 3
      - python3 "$SBX_FIXTURES/usage_config.py" merged .usage-config
      - python3 "$SBX_FIXTURES/usage_config.py" unsent .usage-config
